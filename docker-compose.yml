# Ejecutar: docker compose up -d (para apagar: docker compose down)

services:
  db:
    image: postgres:18
    container_name: buendescanso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-buendescanso}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-buendescanso}
      POSTGRES_DB: ${DB_NAME:-buendescanso}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_datos_de_prueba.sql:/docker-entrypoint-initdb.d/02_datos_de_prueba.sql:ro
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
